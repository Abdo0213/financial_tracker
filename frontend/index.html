<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tracker Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wallet-container">
        <!-- Header -->
        <header class="header">
            <div class="user-info">
                <div class="avatar"></div>
                <div>
                    <h1>Welcome back,</h1>
                    <p>Track your finances</p>
                </div>
            </div>
            <button class="voice-btn" id="record-btn" title="Hold to Record Voice">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
        </header>

        <!-- Balance Card -->
        <section class="balance-card">
            <h2>Total Balance</h2>
            <div class="balance-amount" id="total-balance">EGP 0.00</div>
            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="budget-progress"></div>
                </div>
                <div class="budget-text">
                    <span id="spent-amount">EGP 0.00</span> spent of <span id="budget-amount">EGP 0.00</span>
                </div>
            </div>
        </section>

        <!-- Quick Text Input Form -->
        <section class="text-input-section">
            <form id="text-input-form" class="text-input-form">
                <input 
                    type="text" 
                    id="text-input" 
                    placeholder="Enter transaction (e.g. دفعت 50 جنيه قهوة)..." 
                    autocomplete="off"
                />
                <button type="submit" id="send-text-btn" class="send-btn" title="Send text">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </section>

        <!-- Categories -->
        <section class="categories-section">
            <h3>Quick Categories</h3>
            <div class="categories-grid">
                <div class="category-item food">
                    <div class="icon">🍔</div>
                    <span>Food</span>
                </div>
                <div class="category-item transport">
                    <div class="icon">🚗</div>
                    <span>Transport</span>
                </div>
                <div class="category-item entertainment">
                    <div class="icon">🎬</div>
                    <span>Fun</span>
                </div>
            </div>
        </section>

        <!-- Goals -->
        <section class="goals-section">
            <h3>Saving Goals</h3>
            <div class="goals-list" id="goals-list">
                <!-- Goals will be injected here -->
            </div>
        </section>

        <!-- Recent Transactions -->
        <section class="transactions-section">
            <div class="section-header">
                <h3>Recent Transactions</h3>
                <a href="#" class="view-all">View All</a>
            </div>
            <div class="transaction-list" id="transaction-list">
                <!-- Transactions will be injected here -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
